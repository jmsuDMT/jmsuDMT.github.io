<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="description" content="佳木斯大学 DMT 社团 —— 写代码、造硬件、把想法变成能跑的东西。">
<meta property="og:title" content="佳木斯大学 DMT 社团">
<meta property="og:description" content="写代码、造硬件，把想法变成能跑的东西。">
<meta property="og:type" content="website">
<title>佳木斯大学 DMT 社团</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div class="grid-bg" aria-hidden="true"></div>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#hero">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text" id="brand-text">DMT</span>
  </a>
  <nav class="nav" id="nav" aria-label="页面导航"></nav>
</header>

<main>

  <section class="hero" id="hero">
    <div class="hero-scan" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="eyebrow" id="hero-eyebrow">JMSU · DMT · EST. 2019</p>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-lead" id="hero-lead"></p>
      <p class="hero-sub" id="hero-sub"></p>
    </div>
    <a class="scroll-hint" href="#what" id="scroll-hint">
      <span class="scroll-line" aria-hidden="true"></span>
      <span class="scroll-label">向下滚动</span>
    </a>
  </section>

  <section class="section" id="what">
    <div class="section-head reveal">
      <span class="section-index">01</span>
      <h2 class="section-title" id="what-title">我们做什么</h2>
      <p class="section-note" id="what-note"></p>
    </div>
    <div class="cards" id="direction-list"></div>
  </section>

  <section class="section" id="works">
    <div class="section-head reveal">
      <span class="section-index">02</span>
      <h2 class="section-title" id="works-title">作品墙</h2>
      <p class="section-note" id="works-note"></p>
    </div>
    <div class="works" id="work-list"></div>
  </section>

  <section class="section" id="timeline">
    <div class="section-head reveal">
      <span class="section-index">03</span>
      <h2 class="section-title" id="timeline-title">一路走来</h2>
      <p class="section-note" id="timeline-note"></p>
    </div>
    <ol class="timeline" id="timeline-list"></ol>
  </section>

  <section class="section" id="join">
    <div class="section-head reveal">
      <span class="section-index">04</span>
      <h2 class="section-title" id="join-title">加入我们</h2>
      <p class="section-note" id="join-lead"></p>
    </div>

    <div class="members reveal">
      <h3 class="sub-title" id="members-title">现任成员</h3>
      <p class="section-note small" id="members-note"></p>
      <ul class="member-list" id="member-list"></ul>
    </div>

    <div class="join reveal" id="join-block"></div>
  </section>

</main>

<footer class="footer">
  <span id="footer-text"></span>
  <span class="footer-dim">纯静态 · GitHub Pages</span>
</footer>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <button class="overlay-close" id="overlay-close" aria-label="关闭">×</button>
    <div class="overlay-image" id="overlay-image"></div>
    <div class="overlay-body">
      <h3 id="overlay-title"></h3>
      <p id="overlay-desc" class="overlay-desc"></p>
      <ul class="overlay-meta" id="overlay-meta"></ul>
      <div class="tags" id="overlay-tags"></div>
    </div>
  </div>
</div>

<noscript>
  <div class="noscript">这个页面需要 JavaScript 才能显示内容。</div>
</noscript>

<script src="assets/js/main.js"></script>
</body>
</html>
